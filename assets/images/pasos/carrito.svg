<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Carrito de compras">
<defs>
  <linearGradient id="basket" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F9F4E9"/><stop offset="1" stop-color="#E3D4B8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="160" height="160" rx="25" fill="#FAF7F0"/>
<circle cx="119" cy="32" r="27" fill="#EEE5D5"/>
<ellipse cx="83" cy="130" rx="49" ry="7" fill="#6A604D" opacity=".13" filter="url(#shadow)"/>
<!-- cart handle and basket -->
<path d="M21 34h15l13 66c1 6 5 9 11 9h51" fill="none" stroke="#3E403B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M47 50h88l-12 48H56Z" fill="url(#basket)" stroke="#3E403B" stroke-width="3.5" stroke-linejoin="round"/>
<!-- basket grid -->
<path d="M61 56 67 92M82 54l3 39M104 54l-2 38M52 70h77M55 83h70" fill="none" stroke="#B29B70" stroke-width="2.4" stroke-linecap="round"/>
<!-- small shoe box in cart -->
<path d="M67 67h43v19H67Z" fill="#FFFFFF" stroke="#8D7957" stroke-width="2"/>
<path d="M67 73h43M88.5 67v19" fill="none" stroke="#C1AD87" stroke-width="2"/>
<!-- wheels -->
<circle cx="65" cy="119" r="8" fill="#333630"/><circle cx="112" cy="119" r="8" fill="#333630"/>
<circle cx="65" cy="119" r="3" fill="#F7F3EA"/><circle cx="112" cy="119" r="3" fill="#F7F3EA"/>
<!-- add badge -->
<circle cx="124" cy="35" r="18" fill="#536D55" stroke="#FAF7F0" stroke-width="3"/>
<path d="M124 26v18M115 35h18" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
</svg>