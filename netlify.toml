# Sitio estático: no requiere comando de compilación.
[build]
  publish = "."

# El catálogo se vuelve a leer en cada visita para reflejar cambios del JSON.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"